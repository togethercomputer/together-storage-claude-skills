name: go-ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  create-ums-sigv4-key-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/create-ums-sigv4-key/client
    env:
      GOWORK: "off"
      GOPRIVATE: github.com/togethercomputer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: skills/create-ums-sigv4-key/client/go.mod
          cache-dependency-path: skills/create-ums-sigv4-key/client/go.sum
      # The client depends on the private togethercomputer/user-management-service module.
      - name: Configure private module access
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          if [ -n "$GO_MODULES_TOKEN" ]; then
            git config --global url."https://x-access-token:${GO_MODULES_TOKEN}@github.com/togethercomputer/".insteadOf "https://github.com/togethercomputer/"
          fi
      - run: go version
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
